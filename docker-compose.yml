services:
  postgres:
    image: postgres:16-alpine
    container_name: mychurch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mychurch
      POSTGRES_USER: mychurch
      POSTGRES_PASSWORD: mychurch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mychurch -d mychurch"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    container_name: mychurch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://mychurch:mychurch@postgres:5432/mychurch
    ports:
      - "4100:3000"
    volumes:
      - ./backend/uploads:/app/uploads

  adminer:
    image: adminer:latest
    container_name: mychurch-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8082:8080"

volumes:
  postgres_data:
