services:
  # Backend Web Service
  - type: web
    name: shekinah-sons-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: shekinah-sons-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 30d
      - key: ADMIN_EMAIL
        value: ariga.dev@gmail.com
      - key: ADMIN_PASSWORD
        value: ariga123
      - key: ADMIN_NAME
        value: Local Admin
      - key: GOOGLE_CLIENT_IDS
        value: 614968507436-blh0cv4db5b5k10d57ki9eltamms24nd.apps.googleusercontent.com
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_ENV
        value: sandbox
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: shekinah-sons-db
    plan: free
